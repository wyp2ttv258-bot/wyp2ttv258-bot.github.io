<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Mini Việt - 20 trò chơi miễn phí</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#f8fafc;background:#091225}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203a72,#091225 65%);min-height:100vh}header{text-align:center;padding:28px 15px 16px}h1{margin:0;color:#facc15;font-size:clamp(28px,5vw,44px)}header p{color:#cbd5e1}main{max-width:1100px;margin:auto;padding:14px}#search{display:block;width:min(100%,460px);margin:0 auto 24px;padding:14px 18px;border-radius:14px;border:1px solid #52658b;background:#152744;color:white;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.tile{background:#192c4d;border:1px solid #354c73;border-radius:17px;padding:22px 10px;color:white;cursor:pointer;font:inherit;min-height:138px}.tile:hover,.tile:focus{background:#294875;outline:2px solid #facc15}.emoji{display:block;font-size:38px;margin-bottom:9px}.tile strong{display:block}.tile small{display:block;color:#b9c9e5;margin-top:6px}.panel{background:#152744;border:1px solid #45608a;border-radius:18px;padding:20px;margin:0 auto 24px;max-width:780px;text-align:center}button{touch-action:manipulation}.action{background:#facc15;color:#1c2540;border:0;border-radius:11px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer;margin:5px}.secondary{background:#334b72;color:white}.status{min-height:30px;color:#fde68a;font-weight:600}.board{display:grid;gap:7px;justify-content:center;margin:18px auto}.cell{width:64px;height:64px;border-radius:10px;border:0;background:#30476d;color:white;font-size:25px;font-weight:bold;cursor:pointer}.cell:disabled{cursor:default;opacity:.9}.big{font-size:56px;margin:14px}.input{padding:12px;border-radius:9px;border:1px solid #60789c;background:#0e1d37;color:white;font-size:18px;width:min(100%,250px)}.options{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.options button{background:#30476d;color:white;border:1px solid #6682aa;padding:12px 16px;border-radius:10px;font-size:17px;cursor:pointer}.options button:hover{background:#44669c}.memory{display:grid;grid-template-columns:repeat(4,65px);justify-content:center;gap:8px}.memory button{width:65px;height:65px;font-size:27px;border:0;border-radius:9px;background:#30476d;color:white}.canvas{background:#0b1730;border:2px solid #607ba8;border-radius:12px;max-width:100%;touch-action:none}.ad{border:1px dashed #65748b;color:#94a3b8;text-align:center;padding:17px;margin:28px auto;max-width:750px;border-radius:12px}footer{text-align:center;color:#9fb2d1;padding:20px}#game[hidden],#catalog[hidden]{display:none} @media(max-width:420px){.cell{width:54px;height:54px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>🎮 GAME MINI VIỆT</h1><p>20 trò chơi miễn phí • Không cần cài đặt • Chơi ngay!</p></header><main><section id="catalog"><input id="search" placeholder="🔎 Tìm trò chơi..." aria-label="Tìm trò chơi"><div class="grid" id="list"></div></section><section id="game" hidden><button class="action secondary" id="back">← Tất cả trò chơi</button><div class="panel"><h2 id="gameTitle"></h2><p class="status" id="status"></p><div id="play"></div><div id="controls"></div></div></section><div class="ad">Vị trí dự kiến đặt quảng cáo (chưa tích hợp mạng quảng cáo)</div></main><footer>© Game Mini Việt • Chơi vui, giải trí lành mạnh</footer><script>
'use strict';
const games=[['⭕','Cờ caro 3×3','Đấu với bạn'],['🧠','Lật thẻ nhớ','Tìm các cặp hình'],['🔢','Đoán số','Đoán từ 1 đến 100'],['✊','Oẳn tù tì','Kéo búa bao'],['⚡','Phản xạ nhanh','Bấm đúng lúc'],['➕','Tính nhẩm','Thử tài toán học'],['🧩','Ghép số 15','Xếp đúng thứ tự'],['🎲','Xúc xắc','Thử vận may'],['🪙','Tung đồng xu','Sấp hay ngửa'],['🎯','Bắn mục tiêu','Chạm thật nhanh'],['🔴','Simon màu sắc','Nhớ chuỗi màu'],['🔤','Đoán chữ','Đoán từ bí mật'],['❓','Đố vui','Trắc nghiệm thú vị'],['🧮','Cộng thật nhanh','60 giây thử thách'],['⏱️','Bấm 10 giây','Canh đúng thời gian'],['🔼','Cao hay thấp','Đoán số tiếp theo'],['💣','Tránh bom','Chọn ô an toàn'],['🔎','Tìm số khác','Quan sát thật kỹ'],['🎨','Đoán màu','Nhìn màu chọn tên'],['🐍','Rắn săn mồi','Điều khiển rắn']];
const $=id=>document.getElementById(id),list=$('list'),play=$('play'),controls=$('controls'),status=$('status');let cleanup=()=>{},active=0;function rand(n){return Math.floor(Math.random()*n)}function choice(a){return a[rand(a.length)]}function btn(label,fn,where=controls){const b=document.createElement('button');b.className='action';b.textContent=label;b.onclick=fn;where.append(b);return b}function text(t){const p=document.createElement('p');p.textContent=t;play.append(p);return p}function input(type='text'){let i=document.createElement('input');i.className='input';i.type=type;play.append(i);return i}function show(s){status.textContent=s}function clear(){cleanup();cleanup=()=>{};play.replaceChildren();controls.replaceChildren();show('')}function start(i){active=i;clear();$('catalog').hidden=true;$('game').hidden=false;$('gameTitle').textContent=games[i][1];window.scrollTo(0,0);run(i)}$('back').onclick=()=>{clear();$('game').hidden=true;$('catalog').hidden=false};function render(){const q=$('search').value.toLocaleLowerCase('vi');list.replaceChildren();games.forEach((g,i)=>{if(!g[1].toLocaleLowerCase('vi').includes(q))return;let b=document.createElement('button');b.className='tile';b.innerHTML='<span class="emoji">'+g[0]+'</span><strong>'+g[1]+'</strong><small>'+g[2]+'</small>';b.onclick=()=>start(i);list.append(b)})}$('search').oninput=render;render();
function grid(n,cols,fn){let d=document.createElement('div');d.className='board';d.style.gridTemplateColumns=`repeat(${cols},max-content)`;play.append(d);return Array.from({length:n},(_,i)=>{let b=document.createElement('button');b.className='cell';b.onclick=()=>fn(i,b);d.append(b);return b})}
function run(i){switch(i){case 0:{let a=Array(9).fill(''),turn='X',done=false;let cells=grid(9,3,(j,b)=>{if(a[j]||done)return;a[j]=turn;b.textContent=turn;let win=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(x=>x.every(k=>a[k]===turn));if(win){done=true;show('🎉 Người chơi '+turn+' thắng!')}else if(a.every(Boolean)){done=true;show('Hòa!')}else{turn=turn==='X'?'O':'X';show('Lượt '+turn)}});show('Lượt X');btn('Chơi lại',()=>start(i));break}
case 1:{let vals=[...['🍎','🐱','🌈','🚗','⭐','⚽','🐸','🍉'],...['🍎','🐱','🌈','🚗','⭐','⚽','🐸','🍉']].sort(()=>Math.random()-.5),open=[],found=new Set(),busy=false;let d=document.createElement('div');d.className='memory';play.append(d);vals.forEach((v,j)=>{let b=document.createElement('button');b.textContent='❔';b.onclick=()=>{if(busy||found.has(j)||open.includes(j))return;b.textContent=v;open.push(j);if(open.length===2){let [a,c]=open;if(vals[a]===vals[c]){found.add(a);found.add(c);open=[];show('Đúng rồi! '+found.size/2+'/8 cặp');if(found.size===16)show('🎉 Hoàn thành!')}else{busy=true;let t=setTimeout(()=>{d.children[a].textContent='❔';d.children[c].textContent='❔';open=[];busy=false},650);cleanup=()=>clearTimeout(t)}}};d.append(b)});btn('Chơi lại',()=>start(i));break}
case 2:{let secret=1+rand(100),count=0;show('Đoán một số từ 1 đến 100');let v=input('number');v.min=1;v.max=100;btn('Đoán',()=>{let n=Number(v.value);if(!v.value||!Number.isInteger(n)||n<1||n>100){show('Nhập số nguyên từ 1 đến 100');return}count++;show(n===secret?'🎉 Chính xác sau '+count+' lượt!':n<secret?'Số bí mật lớn hơn!':'Số bí mật nhỏ hơn!')});btn('Chơi lại',()=>start(i));break}
case 3:{let names=['✊ Búa','✌️ Kéo','✋ Bao'];text('Chọn một hình:');let d=document.createElement('div');d.className='options';play.append(d);names.forEach((n,j)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{let c=rand(3);show('Máy chọn '+names[c]+' — '+(j===c?'Hòa!':(j===0&&c===1)||(j===1&&c===2)||(j===2&&c===0)?'🎉 Bạn thắng!':'Máy thắng!'))};d.append(b)});break}
case 4:{let ready=false,timer,started=0;let b=btn('Bắt đầu',()=>{ready=false;show('Chờ màu xanh...');b.textContent='Chờ...';b.style.background='#ef4444';started=0;timer=setTimeout(()=>{ready=true;started=performance.now();b.textContent='BẤM NGAY!';b.style.background='#22c55e'},1000+rand(3000))});b.onclick=()=>{if(!started&&!ready&&b.textContent==='Bắt đầu'){b.textContent='Chờ...';show('Chờ màu xanh...');b.style.background='#ef4444';timer=setTimeout(()=>{ready=true;started=performance.now();b.textContent='BẤM NGAY!';b.style.background='#22c55e'},1000+rand(3000))}else if(!ready){clearTimeout(timer);show('Bấm sớm quá!');b.textContent='Thử lại';b.style.background='#facc15';b.onclick=()=>start(i)}else{show('⚡ Phản xạ: '+Math.round(performance.now()-started)+' ms');ready=false;b.textContent='Thử lại';b.style.background='#facc15';b.onclick=()=>start(i)}};cleanup=()=>clearTimeout(timer);break}
case 5:case 13:{let score=0,time=60,timer;let q=text(''),v=input('number');function next(){let a=rand(i===5?40:20)+1,b=rand(i===5?40:20)+1;q.textContent=a+' + '+b+' = ?';q.dataset.answer=a+b;v.value='';v.focus()}btn('Trả lời',()=>{if(!v.value)return;if(Number(v.value)===Number(q.dataset.answer))score++;show('Điểm: '+score);next()});v.onkeydown=e=>{if(e.key==='Enter')controls.querySelector('button').click()};next();if(i===13){timer=setInterval(()=>{time--;show('Điểm: '+score+' • Còn '+time+' giây');if(time<=0){clearInterval(timer);v.disabled=true;controls.querySelector('button').disabled=true;show('Hết giờ! Bạn được '+score+' điểm')}},1000);cleanup=()=>clearInterval(timer)}btn('Chơi lại',()=>start(i));break}
case 6:{let arr=Array.from({length:15},(_,j)=>j+1).concat(0);for(let k=0;k<150;k++){let z=arr.indexOf(0),moves=[z-4,z+4,z%4?z-1:-1,z%4<3?z+1:-1].filter(x=>x>=0&&x<16);let x=choice(moves);[arr[z],arr[x]]=[arr[x],arr[z]]}let cells=grid(16,4,j=>{let z=arr.indexOf(0);if(!([z-4,z+4,z%4?z-1:-1,z%4<3?z+1:-1].includes(j)))return;[arr[z],arr[j]]=[arr[j],arr[z]];draw();if(arr.every((x,k)=>x===(k+1)%16))show('🎉 Bạn đã giải xong!')});function draw(){cells.forEach((b,k)=>{b.textContent=arr[k]||'';b.style.visibility=arr[k]?'visible':'hidden'})}draw();btn('Xáo lại',()=>start(i));break}
case 7:{let p=text('🎲 🎲');p.className='big';btn('Tung xúc xắc',()=>{let a=1+rand(6),b=1+rand(6);p.textContent='🎲 '+a+' + '+b;show('Tổng: '+(a+b))});break}
case 8:{let p=text('🪙');p.className='big';btn('Tung xu',()=>show(rand(2)?'Ngửa!':'Sấp!'));break}
case 9:{let score=0,timer;show('Chạm mục tiêu 10 lần nhanh nhất');let started=performance.now(),cells=grid(16,4,j=>{if(j!==target)return;score++;if(score===10){show('🎉 Hoàn thành trong '+((performance.now()-started)/1000).toFixed(1)+' giây');target=-1;draw();return}target=rand(16);draw()});let target=rand(16);function draw(){cells.forEach((b,j)=>{b.textContent=j===target?'🎯':'';b.style.background=j===target?'#eab308':'#30476d'})}draw();btn('Chơi lại',()=>start(i));break}
case 10:{let colors=['🔴','🟢','🔵','🟡'],seq=[],pos=0,locked=true,timers=[];let p=text('Nhớ thứ tự màu sáng lên');let d=document.createElement('div');d.className='options';play.append(d);let buttons=colors.map((c,j)=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{if(locked)return;if(j===seq[pos]){pos++;if(pos===seq.length){locked=true;show('Đúng! Cấp '+seq.length);timers.push(setTimeout(round,700))}}else{locked=true;show('Sai rồi! Bạn qua '+(seq.length-1)+' cấp. Bấm chơi lại.')}};d.append(b);return b});function round(){seq.push(rand(4));pos=0;locked=true;show('Quan sát...');seq.forEach((x,k)=>{timers.push(setTimeout(()=>{p.textContent=colors[x];buttons[x].style.background='#facc15'},k*800+300));timers.push(setTimeout(()=>{p.textContent='•';buttons[x].style.background='#30476d';if(k===seq.length-1){locked=false;show('Nhập lại chuỗi!')}},k*800+850))})}btn('Bắt đầu / Chơi lại',()=>start(i));round();cleanup=()=>timers.forEach(clearTimeout);break}
case 11:{let words=['VIETNAM','HOCTAP','BANBE','MATTROI','HOAHONG','CONMEO','TRUONGHOC'],w=choice(words),guessed=new Set(),tries=7;let p=text('');let v=input();v.maxLength=1;function draw(){p.textContent=[...w].map(c=>guessed.has(c)?c:'_').join(' ');show('Còn '+tries+' lượt sai');if([...w].every(c=>guessed.has(c)))show('🎉 Đoán đúng!');else if(tries===0)show('Hết lượt! Đáp án: '+w)}btn('Thử chữ',()=>{let c=v.value.trim().toUpperCase();v.value='';if(!/^[A-Z]$/.test(c)||guessed.has(c)||tries===0)return;guessed.add(c);if(!w.includes(c))tries--;draw()});btn('Từ mới',()=>start(i));draw();break}
case 12:{let qs=[['Thủ đô Việt Nam là gì?',['Hà Nội','Đà Nẵng','Huế'],0],['Một tuần có mấy ngày?',['5','7','9'],1],['Trái Đất quay quanh gì?',['Mặt Trăng','Mặt Trời','Sao Hỏa'],1],['2 × 8 bằng bao nhiêu?',['12','16','18'],1],['Màu nào pha từ xanh dương và vàng?',['Xanh lá','Đỏ','Tím'],0]];let n=0,score=0;function next(){play.replaceChildren();if(n===qs.length){show('🎉 Đúng '+score+'/'+qs.length+' câu');btn('Chơi lại',()=>start(i));return}text(qs[n][0]);let d=document.createElement('div');d.className='options';play.append(d);qs[n][1].forEach((a,j)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(j===qs[n][2])score++;n++;next()};d.append(b)});show('Câu '+(n+1)+'/'+qs.length+' • Điểm '+score)}next();break}
case 14:{let began=0,elapsed=0,timer;let p=text('0.00 giây');p.className='big';let b=btn('Bắt đầu',()=>{began=performance.now();timer=setInterval(()=>{elapsed=(performance.now()-began)/1000;p.textContent=elapsed.toFixed(2)+' giây'},40);b.textContent='Dừng';b.onclick=()=>{clearInterval(timer);elapsed=(performance.now()-began)/1000;p.textContent=elapsed.toFixed(2)+' giây';show('Lệch '+Math.abs(10-elapsed).toFixed(2)+' giây so với 10 giây');b.textContent='Thử lại';b.onclick=()=>start(i)}});cleanup=()=>clearInterval(timer);break}
case 15:{let current=1+rand(12),score=0;let p=text('Số hiện tại: '+current);let d=document.createElement('div');d.className='options';play.append(d);['Cao hơn','Thấp hơn'].forEach((label,j)=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{let next=1+rand(12);if((j===0&&next>current)||(j===1&&next<current))score++;else if(next!==current)score=Math.max(0,score-1);show('Ra số '+next+' • Điểm: '+score+(next===current?' (bằng nhau)':''));current=next;p.textContent='Số hiện tại: '+current};d.append(b)});break}
case 16:{let bombs=new Set();while(bombs.size<4)bombs.add(rand(16));let found=0,over=false;let cells=grid(16,4,(j,b)=>{if(over||b.disabled)return;b.disabled=true;if(bombs.has(j)){b.textContent='💣';over=true;show('Trúng bom! Bạn tìm được '+found+' ô an toàn');cells.forEach((x,k)=>{if(bombs.has(k))x.textContent='💣'})}else{b.textContent='💎';found++;show('Ô an toàn: '+found+'/12');if(found===12){over=true;show('🎉 Bạn đã tránh tất cả bom!')}}});btn('Chơi lại',()=>start(i));break}
case 17:{let odd=rand(25),chars=['8','B','O','0','6'],c=choice(chars),other=({'8':'B','B':'8','O':'0','0':'O','6':'8'})[c];let cells=grid(25,5,j=>{show(j===odd?'🎉 Chính xác!':'Chưa đúng, thử lại!')});cells.forEach((b,j)=>{b.textContent=j===odd?other:c;b.style.fontSize='22px'});btn('Ván mới',()=>start(i));break}
case 18:{let names=['Đỏ','Xanh lá','Xanh dương','Vàng','Tím'],hex=['#ef4444','#22c55e','#3b82f6','#facc15','#a855f7'],correct=rand(5);let p=text('●');p.style.fontSize='90px';p.style.color=hex[correct];let d=document.createElement('div');d.className='options';play.append(d);names.forEach((n,j)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>show(j===correct?'🎉 Chính xác!':'Chưa đúng, thử lại!');d.append(b)});btn('Màu mới',()=>start(i));break}
case 19:{let canvas=document.createElement('canvas');canvas.width=320;canvas.height=320;canvas.className='canvas';play.append(canvas);let ctx=canvas.getContext('2d'),snake=[{x:8,y:8}],dir={x:1,y:0},next={x:1,y:0},food={x:3,y:3},score=0,alive=true,timer;function spawn(){let empty=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(!snake.some(s=>s.x===x&&s.y===y))empty.push({x,y});if(!empty.length){alive=false;show('🎉 Bạn thắng!');return}food=choice(empty)}function draw(){ctx.fillStyle='#0b1730';ctx.fillRect(0,0,320,320);ctx.fillStyle='#f43f5e';ctx.fillRect(food.x*20+2,food.y*20+2,16,16);ctx.fillStyle='#4ade80';snake.forEach(s=>ctx.fillRect(s.x*20+1,s.y*20+1,18,18))}function tick(){if(!alive)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=h.x===food.x&&h.y===food.y,body=eat?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=16||h.y>=16||body.some(s=>s.x===h.x&&s.y===h.y)){alive=false;show('Kết thúc! Điểm: '+score);return}snake.unshift(h);if(eat){score++;spawn();show('Điểm: '+score)}else snake.pop();draw()}function move(x,y){if(dir.x===-x&&dir.y===-y)return;next={x,y}}let key=e=>{let map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(map[e.key]){e.preventDefault();move(...map[e.key])}};document.addEventListener('keydown',key);let d=document.createElement('div');d.className='options';play.append(d);[['⬆️',0,-1],['⬅️',-1,0],['⬇️',0,1],['➡️',1,0]].forEach(([name,x,y])=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>move(x,y);d.append(b)});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))},{passive:true});show('Dùng phím mũi tên hoặc nút điều khiển');draw();timer=setInterval(tick,160);cleanup=()=>{clearInterval(timer);document.removeEventListener('keydown',key)};btn('Chơi lại',()=>start(i));break}
}}
</script></body></html>
